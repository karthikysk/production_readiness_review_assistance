<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">PRRA: Production Readiness Review Assistant</title>
  <desc id="d">A checklist with green ticks and an amber warning, beside the project name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <!-- checklist card -->
  <g transform="translate(70,50)">
    <rect width="200" height="200" rx="18" fill="#f8fafc"/>
    <rect x="18" y="14" width="164" height="10" rx="5" fill="#cbd5e1"/>
    <g font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700">
      <circle cx="42" cy="64" r="15" fill="#10b981"/><path d="M34 64l6 6 11-12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="68" y="58" width="100" height="12" rx="6" fill="#94a3b8"/>
      <circle cx="42" cy="108" r="15" fill="#10b981"/><path d="M34 108l6 6 11-12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="68" y="102" width="82" height="12" rx="6" fill="#94a3b8"/>
      <circle cx="42" cy="152" r="15" fill="#f59e0b"/><text x="42" y="160" text-anchor="middle" fill="#fff">!</text>
      <rect x="68" y="146" width="92" height="12" rx="6" fill="#94a3b8"/>
    </g>
  </g>
  <!-- text -->
  <g font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" fill="#f8fafc">
    <text x="320" y="140" font-size="86" font-weight="800" letter-spacing="2">PRRA</text>
    <text x="324" y="190" font-size="32" font-weight="500" fill="#bfdbfe">Production Readiness Review Assistant</text>
    <text x="324" y="232" font-size="22" fill="#93c5fd">Know before you go live. Check it. Explain it. Fix it.</text>
  </g>
  <!-- signal dots -->
  <g transform="translate(1020,70)">
    <circle cx="0" cy="0" r="14" fill="#10b981"/><circle cx="50" cy="0" r="14" fill="#f59e0b"/><circle cx="100" cy="0" r="14" fill="#ef4444"/>
  </g>
</svg>
